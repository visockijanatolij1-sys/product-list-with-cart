<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product List With Card</title>
    <link
      rel="shortcut icon"
      href="./images/favicon-32x32 (2).png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <main>
          <div class="products-body">
            <h1 class="body-products_title">Desserts</h1>
            <div class="products-row">
              <div class="products-column">
                <div class="column-products_image ibg"></div>
                <button class="add-button">
                  <img src="./images/icon-add-to-cart.svg" alt="" />
                  <p class="button-text">Add to Card</p>
                </button>
                <div class="column-products_block">
                  <p class="product-name">Waffle</p>
                  <p class="product-description">Waffle with Berries</p>
                  <p class="product-price">$6.50</p>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body"></div>
        </main>
      </div>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
